[project]
name = "groundtruth-agent"
version = "0.1.0"
description = "Always-on local activity understanding"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pillow>=10.3",
    "mss>=9.0",
    "psutil>=5.9",
    "pywin32>=306; sys_platform == \"win32\"",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
